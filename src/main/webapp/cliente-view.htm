$formTable


<!-- Bulma modal. Visibility toggled via .is-active. -->
<div id="deleteModal" class="modal">
    <div class="modal-background"></div>
    <div class="modal-card">
        <header class="modal-card-head">
            <p class="modal-card-title">Confirm deletion</p>
            <button class="delete" aria-label="close" id="deleteModalClose" type="button"></button>
        </header>
        <section class="modal-card-body">
            Are you sure you want to delete this cliente?
            This action cannot be undone.
        </section>
        <footer class="modal-card-foot">
            <button class="button" id="deleteCancel" type="button">Cancel</button>
            <button class="button is-danger" id="deleteConfirm" type="button">Delete</button>
        </footer>
    </div>
</div>

<script>
(function () {
    var modal = document.getElementById('deleteModal');
    var pendingHref = null;

    // Intercept the ActionLink click, store the real href, show the modal.
    // The href Click rendered is preserved; only the default navigation
    // is suppressed until the user confirms.
    window.onDeleteClick = function (link) {
        pendingHref = link.href;
        modal.classList.add('is-active');
        return false;
    };

    function close() {
        pendingHref = null;
        modal.classList.remove('is-active');
    }

    document.getElementById('deleteCancel').addEventListener('click', close);
    document.getElementById('deleteModalClose').addEventListener('click', close);
    document.querySelector('#deleteModal .modal-background').addEventListener('click', close);

    document.getElementById('deleteConfirm').addEventListener('click', function () {
        if (pendingHref) {
            window.location.href = pendingHref;
        }
        modal.classList.remove('is-active');
    });
})();
</script>
