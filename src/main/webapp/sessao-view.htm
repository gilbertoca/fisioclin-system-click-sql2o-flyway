<article id="sessao-view">
    <header>
        <h1>Agenda do Dia</h1>
    </header>

    #if($mensagem)
    <p><mark>$mensagem</mark></p>
    #end

    $formTable

    <!-- Delete confirmation dialog (native <dialog>) -->
    <dialog id="deleteDialog">
        <article>
            <header><strong>Confirme a deleção</strong></header>
            <p>Desfazer o agendamento? Essa ação não poderá ser desfeita.</p>
            <footer>
                <button id="deleteCancel" type="button">Cancelar</button>
                <button id="deleteConfirm" type="button">Deletar</button>
            </footer>
        </article>
    </dialog>
    <script>
        (function () {
            var dialog = document.getElementById('deleteDialog');
            var pendingHref = null;

            // Intercept the ActionLink click, store its href, show the dialog.
            window.onDeleteClick = function (link) {
                pendingHref = link.href;
                dialog.showModal();
                return false;
            };

            document.getElementById('deleteCancel').addEventListener('click', function () {
                pendingHref = null;
                dialog.close();
            });

            // Confirm: navigate to the original ActionLink URL.
            document.getElementById('deleteConfirm').addEventListener('click', function () {
                if (pendingHref) {
                    window.location.href = pendingHref;
                }
                dialog.close();
            });
        })();
    </script>
</article>
