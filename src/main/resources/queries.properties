    ORDER BY s.dt_hora_inicio ASC

sessao.create=\
    INSERT INTO fisio.sessao (cliente_id, profissional_id, modalidade_id, dt_hora_inicio, dt_hora_fim, sessao_tipo, pagamento_origem, sessao_situacao, observacoes_recepcao) \
    VALUES (:clienteId, :profissionalId, :modalidadeId, :dataHoraInicio, :dataHoraFim, :sessaoTipo, :pagamentoOrigem, :situacao, :observacoesRecepcao)

sessao.update=\
