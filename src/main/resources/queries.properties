# ============================================================================
# FATURAMENTO (BILLING MODULE) CRUD - SUFIXO OPERACIONAL (rascunho V2)
# ============================================================================

# Mapeamento do get que monta a raiz e prepara as propriedades para o Grafo Rico
faturamento.get=\
    SELECT f.faturamento_id AS id, f.pagamento_origem AS pagamentoOrigem, f.valor_total_faturado AS valorTotalFaturado, \
           f.data_emissao AS dataEmissao, f.faturamento_status AS situacao, f.observacoes AS observacoes, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\" \
    FROM fisio.faturamento f \
    JOIN fisio.cliente c ON f.cliente_id = c.cliente_id \
    WHERE f.faturamento_id = :id

# Listagem central do Cockpit Financeiro
faturamento.getAll=\
    SELECT f.faturamento_id AS id, f.pagamento_origem AS pagamentoOrigem, f.valor_total_faturado AS valorTotalFaturado, \
           f.data_emissao AS dataEmissao, f.faturamento_status AS situacao, f.observacoes AS observacoes, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\" \
    FROM fisio.faturamento f \
    JOIN fisio.cliente c ON f.cliente_id = c.cliente_id \
    ORDER BY f.data_emissao DESC

# Nota de Escrita: O bind l\u00ea 'pagamentoOrigem', 'valorTotalFaturado', 'dataEmissao', 'situacao', 'observacoes'.
# O ID do cliente \u00e9 mapeado de forma expl\u00edcita caso n\u00e3o use interceptores planos na raiz da entidade.
faturamento.create=\
    INSERT INTO fisio.faturamento (cliente_id, pagamento_origem, convenio_id, valor_total_faturado, data_emissao, faturamento_status, observacoes) \
    VALUES (:clienteId, :pagamentoOrigem, :convenioId, :valorTotalFaturado, :dataEmissao, :situacao, :observacoes)

faturamento.update=\
    UPDATE fisio.faturamento SET faturamento_status = :situacao, observacoes = :observacoes \
    WHERE faturamento_id = :id

faturamento.delete=\
    DELETE FROM fisio.faturamento WHERE faturamento_id = :id

faturamento.getAllLikeFaturamentosituacao=\
    SELECT f.faturamento_id AS id, f.pagamento_origem AS pagamentoOrigem, f.valor_total_faturado AS valorTotalFaturado, \
           f.data_emissao AS dataEmissao, f.situacao AS situacao, f.observacoes AS observacoes, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\" \
    FROM fisio.faturamento f \
    JOIN fisio.cliente c ON f.cliente_id = c.cliente_id \
    WHERE LOWER(f.faturamento_status) LIKE LOWER(:situacao) \
    ORDER BY f.data_emissao DESC

# ============================================================================
# SUB-ELEMENTOS FINANCEIROS (ITEMS & PARCELAS)
# ============================================================================

# Inser\u00e7\u00e3o das linhas de amarra\u00e7\u00e3o de itens (Transaction Line Items)
faturamento_item.create=\
    INSERT INTO fisio.faturamento_item(faturamento_id, sessao_id, valor_item) \
    VALUES (:idFaturamento, :idSessao, :valorItem)

# Inser\u00e7\u00e3o direta de parcelas vinculadas ao caixa. O bind l\u00ea propriedades planas do modelo RecebimentoParcela.
recebimento_parcela.create=\
    INSERT INTO fisio.recebimento_parcela (faturamento_id, numero_parcela, valor_parcela, data_vencimento, pagamento_status, data_pagamento, pagamento_meio) \
    VALUES (:idFaturamento, :numeroParcela, :valorParcela, :dataVencimento, :situacao, :dataPagamento, :pagamentoMeio)
