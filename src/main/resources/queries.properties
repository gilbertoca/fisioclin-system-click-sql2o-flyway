# ============================================================================
# SESSAO (APPOINTMENT) CRUD & VALIDATIONS
# ============================================================================
# Estados ativos para conflito de agenda: AGENDADA, CONFIRMADA e EM_ANDAMENTO.
# Regra de grupo: overlap é permitido na MESMA modalidade até esgotar
# modalidade.capacidade_simultanea (ex.: pilates com 4 pacientes). Overlap com
# modalidade DIFERENTE é sempre conflito (o profissional não divide o foco).
# :sessaoId null na criação; preenchido na edição (exclui a própria sessão).
sessao.verificarConflitoOutraModalidade=\
    SELECT COUNT(*) FROM fisio.sessao \
    WHERE profissional_id = :profissionalId \
      AND sessao_situacao IN ('AGENDADA', 'CONFIRMADA', 'EM_ANDAMENTO') \
      AND (:dataHoraInicio < dt_hora_fim AND :dataHoraFim > dt_hora_inicio) \
      AND modalidade_id <> :modalidadeId \
      AND (:sessaoId IS NULL OR sessao_id <> :sessaoId)

sessao.verificarCapacidadeGrupo=\
    SELECT COUNT(*) FROM fisio.sessao \
    WHERE profissional_id = :profissionalId \
      AND sessao_situacao IN ('AGENDADA', 'CONFIRMADA', 'EM_ANDAMENTO') \
      AND (:dataHoraInicio < dt_hora_fim AND :dataHoraFim > dt_hora_inicio) \
      AND modalidade_id = :modalidadeId \
      AND (:sessaoId IS NULL OR sessao_id <> :sessaoId)

# Atendimentos do profissional no dia (lista da tela da sala), com flag de
# registro do atendimento (registro_dt_inicio marcado no iniciarAtendimento)
sessao.findGridAgenda=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, s.pagamento_origem AS pagamentoOrigem, \
           s.observacoes_recepcao AS observacoesRecepcao, \
           (s.registro_dt_inicio IS NOT NULL) AS possuiProntuario, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", c.cpf AS \"cliente.cpf\", \
           conv.convenio_id AS \"cliente.convenio.id\", conv.nome AS \"cliente.convenio.nome\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE s.dt_hora_inicio >= :inicioDia AND s.dt_hora_inicio < :fimDia \
      AND (:profissionalNome IS NULL OR :profissionalNome = '' OR LOWER(p.nome) LIKE CONCAT('%', LOWER(:profissionalNome), '%')) \
    ORDER BY s.dt_hora_inicio ASC

# Guarda de exclusão: leitura do estado atual da sessão
sessao.getSituacao=\
    SELECT sessao_situacao AS situacao FROM fisio.sessao WHERE sessao_id = :id

# Transições de situação do ciclo operacional, checadas na aplicação via
# SessaoSituacao.podeTransicionarPara. O registro de atendimento é coluna da
# própria sessão (1:1): iniciar marca registro_dt_inicio (idempotente via
# COALESCE); finalizar marca registro_dt_fim.
sessao.iniciarAtendimento=\
    UPDATE fisio.sessao SET sessao_situacao = 'EM_ANDAMENTO', \
           registro_dt_inicio = COALESCE(registro_dt_inicio, CURRENT_TIMESTAMP) \
    WHERE sessao_id = :id

sessao.finalizarAtendimento=\
    UPDATE fisio.sessao SET sessao_situacao = 'REALIZADA', \
           registro_dt_fim = COALESCE(registro_dt_fim, CURRENT_TIMESTAMP) \
    WHERE sessao_id = :id

# Gravação do registro do atendimento na sala (textos clínicos); os
# registro_dt_* são marcados apenas pelas transições acima
sessao.updateRegistro=\
    UPDATE fisio.sessao SET registro_relato = :registroRelato, registro_avaliacao = :registroAvaliacao, \
           registro_conduta = :registroConduta, registro_orientacoes = :registroOrientacoes \
    WHERE sessao_id = :id

sessao.get=\
    SELECT s.sessao_id AS id, s.dt_hora_inicio AS dataHoraInicio, s.dt_hora_fim AS dataHoraFim, \
           s.sessao_situacao AS situacao, s.sessao_tipo AS sessaoTipo, s.pagamento_origem AS pagamentoOrigem, \
           s.observacoes_recepcao AS observacoesRecepcao, \
           (s.registro_dt_inicio IS NOT NULL) AS possuiProntuario, \
           s.registro_relato AS registroRelato, s.registro_avaliacao AS registroAvaliacao, \
           s.registro_conduta AS registroConduta, s.registro_orientacoes AS registroOrientacoes, \
           s.registro_dt_inicio AS registroDtInicio, s.registro_dt_fim AS registroDtFim, \
           c.cliente_id AS \"cliente.id\", c.nome AS \"cliente.nome\", c.cpf AS \"cliente.cpf\", \
           conv.convenio_id AS \"cliente.convenio.id\", conv.nome AS \"cliente.convenio.nome\", \
           p.profissional_id AS \"profissional.id\", p.nome AS \"profissional.nome\", \
           m.modalidade_id AS \"modalidade.id\", m.nome AS \"modalidade.nome\" \
    FROM fisio.sessao s \
    JOIN fisio.cliente c ON s.cliente_id = c.cliente_id \
    LEFT JOIN fisio.convenio conv ON c.convenio_id = conv.convenio_id \
    JOIN fisio.profissional p ON s.profissional_id = p.profissional_id \
    JOIN fisio.modalidade m ON s.modalidade_id = m.modalidade_id \
    WHERE s.sessao_id = :id

# Todos os registros de sessao (agenda atual e futura), ordenados pela ultima
# insercao: as sessoes recem-agendadas aparecem no topo. Filtro de nome do
# profissional encaminhado pela pagina (Column.setFilterBy + getFilters).
